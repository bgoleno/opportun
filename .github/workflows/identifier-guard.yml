# Fails a pull request if a withheld real-world identifier appears in the tree. The list of
# terms is NOT in this file on purpose (that would re-publish the very names we withhold): it
# comes from the repository secret BLOCKED_IDENTIFIERS, space- or newline-separated. If the
# secret is unset the job is a no-op with a warning, so a fork without the secret is not broken.
name: Identifier guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan for withheld identifiers
        env:
          TERMS: ${{ secrets.BLOCKED_IDENTIFIERS }}
        run: |
          if [ -z "${TERMS// /}" ]; then
            echo "::warning::BLOCKED_IDENTIFIERS secret is not set; identifier guard skipped."
            exit 0
          fi
          # The job log is public, and Actions masks the secret's whole value, not each term in
          # it. So every term is masked before anything else is printed, and a hit is reported as
          # file:line only, never the term or the matching line (#520). A mask matches the term
          # only as the secret spells it and the scan ignores case, so a path that holds any term
          # in any case is not printed either: only its line number is. Nothing in this step may
          # run with set -x, which would echo each term as it is used.
          for t in $TERMS; do echo "::add-mask::$t"; done
          where() {
            cut -d: -f1,2 | head -5 | while IFS= read -r loc; do
              path=${loc%:*}
              for u in $TERMS; do
                if printf '%s' "$path" | grep -qiF -- "$u"; then
                  path='(a file whose name holds a withheld term)'
                  break
                fi
              done
              printf '%s:%s\n' "$path" "${loc##*:}"
            done
          }
          # Innocuous substrings that legitimately contain a blocked term (a city name, a
          # camelCase identifier, a dependency hash). Expand as real false positives appear.
          allow='francisco|withpepper|withpeople|rhel'
          bad=0
          for t in $TERMS; do
            # Letters-only terms match on word boundaries so a short term does not fire inside
            # a longer word; anything with punctuation or digits is matched as a literal.
            if printf '%s' "$t" | grep -qE '^[A-Za-z]+$'; then
              hits=$(git grep -niIE -- "(^|[^A-Za-z])${t}([^A-Za-z]|\$)" -- . ':!pnpm-lock.yaml' 2>/dev/null | grep -viE "$allow" || true)
            else
              hits=$(git grep -niIF -- "$t" -- . ':!pnpm-lock.yaml' 2>/dev/null || true)
            fi
            if [ -n "$hits" ]; then
              echo "::error::withheld identifier present; remove it from these places:"
              printf '%s\n' "$hits" | where
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "Identifier guard: clean."
