# Fails a pull request if a withheld real-world identifier appears in the tree. The list of
# terms is NOT in this file on purpose (that would re-publish the very names we withhold): it
# comes from the repository secret BLOCKED_IDENTIFIERS, space- or newline-separated. If the
# secret is unset the job is a no-op with a warning, so a fork without the secret is not broken.
name: Identifier guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes with git: the token is not left in .git/config (#619).
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Scan for withheld identifiers
        env:
          TERMS: ${{ secrets.BLOCKED_IDENTIFIERS }}
        # The scan, its masking and its matching are in .github/scripts/identifier-guard.mjs, with
        # tests beside it (#619): the terms are never expanded by a shell, and the log shows only
        # masks and file:line. Nothing in this step may run with set -x.
        run: |
          node .github/scripts/identifier-guard.mjs
