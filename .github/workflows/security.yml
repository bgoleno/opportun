name: Security

# NFR-SEC8: dependency vulnerability scanning (OSV), static analysis (CodeQL), and a review of
# every dependency a pull request adds or changes (known vulnerabilities and licenses, C-5).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged dependencies still surface.
    - cron: '23 4 * * 1'

permissions:
  contents: read

# Action references are pinned to full commit SHAs with the version as a trailing comment
# (Dependabot keeps them current, #728). Container images, the OSV scanner's among them, are
# pinned by digest (#733): a container action that names its image by tag is not used, since its
# commit pin does not pin what runs (images-pinned.test.mjs holds both).

jobs:
  visibility:
    # Code scanning upload needs a public repo or Advanced Security, so SARIF goes to code
    # scanning only when the repo is public; otherwise the results are kept as run artifacts.
    # Read from the API because github.event.repository is absent on scheduled runs.
    name: Repository visibility
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - name: Read repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private == false' || echo false)"
          echo "public=${public}" >> "$GITHUB_OUTPUT"

  osv-scanner:
    name: OSV vulnerability scan
    needs: visibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: the token is not left in .git/config (#619).
          persist-credentials: false

      # The scanner runs as its container image pinned by digest (#733), not through
      # google/osv-scanner-action: that is a container action whose image is named by tag
      # (ghcr.io/google/osv-scanner-action:v2.7.0), so pinning the action's commit did not pin the
      # code that scanned. The workspace is mounted at its own path, so the SARIF's file paths are
      # the runner's and code scanning resolves them. Exit 1 means findings; any other nonzero
      # status, or no SARIF, is a scan that did not complete, which must not pass as "no findings".
      - name: Scan the lockfile
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            --lockfile=pnpm-lock.yaml --format=sarif --output=osv-results.sarif
          status=$?
          set -e
          echo "osv-scanner exit status: $status"
          if [ ! -s osv-results.sarif ] || { [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; }; then
            echo "::error::OSV-Scanner did not complete (status $status); see the scan above."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # As the reporter action did (--gh-annotations, --fail-on-vuln): one annotation per finding,
      # and any finding fails the job. The SARIF is kept and uploaded below either way.
      - name: Report findings
        run: node .github/scripts/osv-sarif-report.mjs osv-results.sarif

      - name: Keep the SARIF as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: ignore
          retention-days: 30

      # Code scanning upload needs a public repo or Advanced Security.
      - name: Upload to code scanning
        if: ${{ !cancelled() && needs.visibility.outputs.public == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  codeql:
    name: CodeQL
    needs: visibility
    runs-on: ubuntu-latest
    permissions:
      # The analyze action reads its workflow run for its status report, even with upload off.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: the token is not left in .git/config (#619).
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # Code scanning upload needs a public repo or Advanced Security.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ needs.visibility.outputs.public == 'true' && 'always' || 'never' }}
          output: codeql-sarif

      - name: Keep the SARIF as a run artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Dependency review
    # Dependency review, like code scanning, needs a public repo or Advanced Security; the OSV
    # scan above still covers known vulnerabilities on private repos.
    needs: visibility
    if: github.event_name == 'pull_request' && needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: the token is not left in .git/config (#619).
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # OSI-approved licenses only (C-5). Exceptions by package: caniuse-lite is
          # browser-support data used at build time (CC-BY-4.0), and mdn-data is css-tree's
          # test-time data dependency (CC0-1.0); neither is shipped as code.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            MPL-2.0, Unlicense, AFL-2.1, Python-2.0, Zlib
          allow-dependencies-licenses: pkg:npm/caniuse-lite, pkg:npm/mdn-data

  ci-scripts:
    # The CI scripts' own tests: the security path matcher, the identifier guard's matching, the
    # workflow checks and the publish script (#63, #619). Nothing in the root `pnpm test` runs
    # them. This tests the PR's copy; the label itself is applied by security-label.yml on
    # pull_request_target with the base branch's copy, so a PR cannot drop its own label (#663).
    name: Unit-test the CI scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes with git: the token is not left in .git/config (#619).
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Unit-test the CI scripts
        run: node --test .github/scripts/*.test.mjs
